# owl-config.toml — プロビジョニング変数台帳
# §4.3: GitOps によるインフラのコード化。provision.sh および各 setup.sh から参照する。
# 本番認証情報は絶対に記載しない。秘密鍵・パスワードは手動投入する。

[host]
hostname = "owlhost"
openbsd_release = "7.9" # Build VM / AP VM のリリースロックステップ (§1.3)
wan_interface = "igc0"  # 外部インターフェース (egress グループ所属; em0 は存在しない)

[network.internal_lan]
# vswitch0: AP VM ↔ DB VM (§1.1)
subnet = "10.0.1.0/24"
ap_vm = "10.0.1.10"
db_vm = "10.0.1.20"

[network.dev_lan]
# vswitch1: Git VM ↔ Build VM (§1.1)
subnet = "10.0.2.0/24"
git_vm = "10.0.2.10"
build_vm = "10.0.2.20"

[network.audit_lan]
# vswitch2: Audit VM 専用、片方向 syslog 受信のみ (§1.1, §6.1)
subnet = "10.0.3.0/24"
audit_vm = "10.0.3.10"

[vm.ap]
name = "vm-ap"
memory = "512M"
disk = "/home/vmm/ap.img"
size = "20G"

[vm.db]
name = "vm-db"
memory = "1G"
disk = "/home/vmm/db.img"
size = "50G"

[vm.git]
name = "vm-git"
memory = "1G"
disk = "/home/vmm/git.img"
size = "50G"

[vm.build]
# GHC は多くのメモリを要求する (§3.1)
name = "vm-build"
memory = "4G"
disk = "/home/vmm/build.img"
size = "50G"

[vm.audit]
# ログ集約のみのため軽量 (§6)
name = "vm-audit"
memory = "256M"
disk = "/home/vmm/audit.img"
size = "10G"

[toolchain]
# GHC2024 (base ^>= 4.20) の要件を満たす最低バージョン。OpenBSD の
# packages/amd64 は point release ごとに古いバージョン名の ghc パッケージを
# 消すため、vm-build/setup.sh はこの値を pkg_add のターゲット指定ではなく
# 「無印 ghc をインストールした後の事後検証の下限」としてのみ使う。
ghc_version = "9.10"
cabal_version = "3.16.1.0"
owl_version = ""           # デプロイ時に vX.Y.Z を設定

[app]
ssh_port = 8022
db_name = "owl"
db_app_user = "owl_app"
db_repl_user = "owl_repl"
# doc/tenant_isolation.md §6.4: owl_app をテーブル所有者にしないためのロール分離。
db_migrator_user = "owl_migrator"
db_platform_admin_user = "owl_platform_admin"
# doc/cqrs.md §4.3, §8: owlv-projector 専用。SELECT のみで owl_app の認証情報は
# 共有しない (プロジェクターが乗っ取られても events を書き換え/偽造できないことを
# Postgres側の権限分離として実際に保証する)。
db_projector_user = "owl_projector"
pg_version = "18"

[user]
# doc/user.md §2/§7: Admin ロールを自動付与する唯一の OS ユーザー名。
# provision.sh 同様、このユーザー自体は usermod -G wheel で事前に手動作成しておく。
root_admin_username = "owladmin"

[install]
# VM の OS インストール時に使う OpenBSD ミラー
# provision.sh 実行時はまだ外向き通信が開いているので直接取得する
openbsd_mirror = "cdn.openbsd.org"

[dr]
# §2.2: 時限開口型暗号化クラウド DR
# ホストは受信者公開鍵のみ保持。秘密鍵はエスクロー管理 (§2.3)
age_pubkey_file = "/etc/owlv/age-recipient.pub"
ramdisk_mount = "/mnt/owl-dr"
b2_remote = "b2:owl-dr-backup"
rsyncnet_remote = "rsyncnet:owl-dr-backup"
window_seconds = 300

[audit]
# §6.2: 検知トリガ(sudo連続失敗・未承認IPからのSSHログイン成功・pf.confハッシュ乖離)
# を検出した際の外部通報先。webhook URL は未確定のため空欄 (TBD) — 確定したら
# ここに設定し、vm-audit/setup.sh の再実行(再プロビジョニング)で配置する。
# 空欄のままだと vm-audit 上の検知スクリプトは検知のみ行いログに記録するが、
# 外部通報は送信しない(送信先未設定での誤爆を避けるための安全側デフォルト)。
notify_webhook_url = ""
# §6.1 鉄則③: 送信先ホワイトリスト固定。webhook URL のホスト名が所属する
# プロバイダの公式 IP レンジ (CIDR) を静的に列挙する。DNS の動的解決はしない
# (DNS リゾルバ自体の侵害・キャッシュポイズニングで送信先が書き換えられるリスク
# を断つため)。webhook_url が決まったらプロバイダの公式ドキュメントに記載の
# CIDR をここへ追加すること。空のままだと audit_lan の外向き443は何も通さない
# (pf table が空 = 全遮断、これも安全側デフォルト)。
notify_dest_cidrs = []
version = "15.0.3"
runner_version = "12.11.1"
# vm-git/setup.sh が `forgejo admin repo create --owner admin --name owlv` で
# リポジトリを作成するため、所有者は Forgejo 上の admin ユーザーになる。
owner = "admin"
repo = "owlv"
# owl-control.sh deploy-poll (§4.2) が Forgejo Releases API を読み書きするための
# アクセストークン。本ファイルには値を書かない — Forgejo Web UI または
# `forgejo admin user generate-access-token` で発行し、ホストの
# /etc/owlv/forgejo_token (mode 600, root 所有) に手動投入する
# (BACKUP_KEY / AGE_PUB と同じ「秘密は手動投入」方針)。
api_token_file = "/etc/owlv/forgejo_token"
