# owl-config.toml — プロビジョニング変数台帳
# §4.3: GitOps によるインフラのコード化。provision.sh および各 setup.sh から参照する。
# 本番認証情報は絶対に記載しない。秘密鍵・パスワードは手動投入する。

[host]
hostname        = "owlhost"
openbsd_release = "7.9"       # Build VM / AP VM のリリースロックステップ (§1.3)
wan_interface   = "igc0"      # 外部インターフェース (egress グループ所属; em0 は存在しない)

[network.internal_lan]
# vswitch0: AP VM ↔ DB VM (§1.1)
subnet = "10.0.1.0/24"
ap_vm  = "10.0.1.10"
db_vm  = "10.0.1.20"

[network.dev_lan]
# vswitch1: Git VM ↔ Build VM (§1.1)
subnet   = "10.0.2.0/24"
git_vm   = "10.0.2.10"
build_vm = "10.0.2.20"

[vm.ap]
name   = "vm-ap"
memory = "512M"
disk   = "/var/vmm/ap.img"
size   = "20G"

[vm.db]
name   = "vm-db"
memory = "1G"
disk   = "/var/vmm/db.img"
size   = "50G"

[vm.git]
name   = "vm-git"
memory = "1G"
disk   = "/var/vmm/git.img"
size   = "50G"

[vm.build]
# GHC は多くのメモリを要求する (§3.1)
name   = "vm-build"
memory = "4G"
disk   = "/var/vmm/build.img"
size   = "50G"

[toolchain]
# (base ^>= 4.20 / GHC >= 9.10) を満たすには OpenBSD 7.9 (現行、
# 2026-05-19 リリース) の packages/amd64 にある ghc-9.10.1 が必要
# (7.8 までの ghc-9.8.3 では base が古く要件を満たせない)
ghc_version   = "9.10.1"
cabal_version = "3.16.1.0"
owl_version   = ""   # デプロイ時に vX.Y.Z を設定

[app]
ssh_port       = 8022
db_name        = "owl"
db_app_user    = "owl_app"
db_repl_user   = "owl_repl"
# doc/tenant_isolation.md §6.4: owl_app をテーブル所有者にしないためのロール分離。
db_migrator_user       = "owl_migrator"
db_platform_admin_user = "owl_platform_admin"
pg_version     = "18"

[user]
# .claude/user.md §2/§7: Admin ロールを自動付与する唯一の OS ユーザー名。
# provision.sh 同様、このユーザー自体は usermod -G wheel で事前に手動作成しておく。
root_admin_username = "owladmin"

[install]
# VM の OS インストール時に使う OpenBSD ミラー
# provision.sh 実行時はまだ外向き通信が開いているので直接取得する
openbsd_mirror = "cdn.openbsd.org"

[dr]
# §2.2: 時限開口型暗号化クラウド DR
# ホストは受信者公開鍵のみ保持。秘密鍵はエスクロー管理 (§2.3)
age_pubkey_file = "/etc/owl/age-recipient.pub"
ramdisk_mount   = "/mnt/owl-dr"
b2_remote       = "b2:owl-dr-backup"
rsyncnet_remote = "rsyncnet:owl-dr-backup"
window_seconds  = 300

[forgejo]
version        = "15.0.3"
runner_version = "12.11.1"
