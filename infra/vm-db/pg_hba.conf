# pg_hba.conf — PostgreSQL クライアント認証設定
# §5: 最小権限。internal_lan 内のみ接続許可。外部からの接続は pf で遮断する。
# プレースホルダー: __AP_IP__, __HOST_IP__ は setup.sh で置換される
#
# TYPE  DATABASE        USER            ADDRESS                 METHOD

# ローカル接続: postgres ユーザー (setup.sh の initdb 用)
local   all             postgres                                trust
# owl_migrator: スキーマ適用 (schema.sql) は運用者がDB VM上でローカルに実行する想定
# (doc/tenant_isolation.md §6.4)。owl_app に所有権を渡さないための専用ロール。
local   owl             owl_migrator                            scram-sha-256
local   all             all                                     reject

# AP VM (owl_app): TLS 必須 + SCRAM-SHA-256（テーブル所有者ではない — RLSが効く）
hostssl owl             owl_app         __AP_IP__/32            scram-sha-256

# AP VM (owl_platform_admin): root_admin_username ブートストラップ専用、tenants一覧参照のみ
hostssl owl             owl_platform_admin __AP_IP__/32         scram-sha-256

# ホスト (owl-control.sh の pg_basebackup): レプリケーション専用ユーザー
hostssl replication     owl_repl        __HOST_IP__/32          scram-sha-256

# それ以外はすべて拒否
host    all             all             0.0.0.0/0               reject
host    all             all             ::/0                    reject
