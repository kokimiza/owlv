# postgresql.conf — owlv DB VM 設定
# §2.1: WAL アーカイブ有効化 (pg_basebackup 前提)
# §4.7: ECL 計算の精度保証のため整合性優先設定
# プレースホルダー: __DB_IP__, __AP_IP__, __HOST_IP__ は setup.sh で置換される

# 接続
listen_addresses        = '__DB_IP__'   # internal_lan のみ (127.0.0.1 は含まない)
port                    = 5432
max_connections         = 50

# TLS (§4.9: 通信経路の暗号化)
ssl                     = on
ssl_cert_file           = 'server.crt'
ssl_key_file            = 'server.key'
ssl_min_protocol_version = 'TLSv1.3'

# WAL (§2.1: レプリケーション・バックアップ基盤)
wal_level               = replica
archive_mode            = on
archive_command         = 'test ! -f /var/postgresql/wal_archive/%f && cp %p /var/postgresql/wal_archive/%f'
archive_timeout         = 300       # 5分でセグメント強制ローテート

# チェックポイント (頻繁にしすぎず、DR 窓口 §2.2 の 300s 以内に収める)
checkpoint_completion_target = 0.9
max_wal_size            = 1GB
min_wal_size            = 128MB

# メモリ (VM は 1GB)
shared_buffers          = 256MB
effective_cache_size    = 512MB
work_mem                = 8MB
maintenance_work_mem    = 64MB

# 整合性 (§2.1: データ喪失ゼロ原則)
fsync                   = on
synchronous_commit      = on
full_page_writes        = on

# ロギング (§5: 監査ログ)
log_destination         = 'stderr'
logging_collector       = on
log_directory           = '/var/log/postgresql'
log_filename            = 'postgresql-%Y-%m-%d.log'
log_rotation_age        = 1d
log_rotation_size       = 100MB
log_min_duration_statement = 1000    # 1秒超のクエリを記録
log_connections         = on
log_disconnections      = on
log_checkpoints         = on
log_lock_waits          = on

# 日本語ロケール設定
lc_messages             = 'C'         # ログは英語 (機械解析しやすいように)
lc_monetary             = 'ja_JP.UTF-8'
lc_numeric              = 'C'
lc_time                 = 'C'

# タイムゾーン (§2.1: タイムスタンプ整合性)
timezone                = 'Asia/Tokyo'
log_timezone            = 'Asia/Tokyo'

# RLS (§4.9: 行レベルセキュリティ。ALTER DATABASE で on にしているがここでも明示)
row_security            = on
