# pf.conf — ホスト OpenBSD パケットフィルタ
# §1.1: エアギャップ設計。デフォルト全遮断。
# §1.1.1: 動的インナーエアギャップ。ピンホール開放/閉鎖は owl-control.sh が制御する。

wan_if   = "egress"    # egress グループ = デフォルトルートを持つ IF (igc0 等)
int_sw   = "bridge0"   # internal_lan L2 スイッチ (VM 間通信, ホスト手動生成)
dev_sw   = "bridge1"   # dev_lan L2 スイッチ (VM 間通信, ホスト手動生成)
int_veb  = "veb0"      # internal_lan vmd 自動生成スイッチ
dev_veb  = "veb1"      # dev_lan vmd 自動生成スイッチ
int_veth = "vether0"   # internal_lan ホスト IP (10.0.1.1)
dev_veth = "vether1"   # dev_lan ホスト IP (10.0.2.1)

ap_vm    = "10.0.1.10"
db_vm    = "10.0.1.20"
git_vm   = "10.0.2.10"
build_vm = "10.0.2.20"

# DR 射出時: ホスト → B2 / rsync.net port 443 (§2.2)。
# デプロイ (AP VM → Git VM) はピンホールではなく恒久ルールで通す
# (下記 AP VM → Git VM 3000/tcp 参照) — Forgejo は HTTP_PORT=3000のみで
# TLS終端を持たないため443向けのピンホールは元々機能しない。
table <pinhole_dst> {}

set block-policy drop
set skip on lo0
block all

# keep state を全 pass ルールに明示する。
# flags S/SA のみでは stateful tracking が確立されず戻りパケットが落ちるため。

# VM DNS → unwind (127.0.0.1:53) リダイレクト
# ゲートウェイ (10.0.1.1 / 10.0.2.1) を DNS サーバーとして機能させる (STEP 3 で unwind 起動)
pass in quick on $int_veth proto { udp tcp } from 10.0.1.0/24 to ($int_veth) port 53 rdr-to 127.0.0.1
pass in quick on $dev_veth proto { udp tcp } from 10.0.2.0/24 to ($dev_veth) port 53 rdr-to 127.0.0.1

# AP VM → DB VM: SCRAM-SHA-256 + TLS (§1.5)
# bridge0 / veb0 の両方を許可 (vmd が veb を自動生成するため両方必要)
pass on $int_sw proto tcp from $ap_vm to $db_vm port 5432 keep state
pass on $int_veb proto tcp from $ap_vm to $db_vm port 5432 keep state

# Build VM → Git VM: 成果物プッシュ (SSH) / Runner ジョブ取得 HTTP (§4.1)
# Forgejo は HTTP_PORT = 3000 でリッスン。443 は TLS 終端が存在しないため使用不可。
pass on $dev_sw proto tcp from $build_vm to $git_vm port { 22 3000 } keep state
pass on $dev_veb proto tcp from $build_vm to $git_vm port { 22 3000 } keep state

# AP VM → Git VM: owl-control.sh deploy がバイナリ取得に使う (§3.1, §4.2)。
# git_vm は内部固定IPのみが宛先になるため (DR射出のような任意の外部宛先とは違い)、
# build_vm の規約に合わせて恒久ルールにする (ピンホールの時限化が要らない)。
# (実際に発生: 旧来の "ピンホールで443" という想定は Forgejo が3000しか
# リッスンしないため最初から機能せず、かつ owl-control.sh はピンホールを
# 開かずに直接 ftp していたため、本番封鎖後は deploy が block all に
# 落ちて確実に失敗していた)。
pass on $dev_sw proto tcp from $ap_vm to $git_vm port 3000 keep state
pass on $dev_veb proto tcp from $ap_vm to $git_vm port 3000 keep state

# ホスト → Git VM: owl-control.sh deploy-poll が Forgejo Releases API を
# 定期照会する (§4.2: PR Approve & Merge で生成された承認済みリリースの検知)。
# 宛先が固定内部IPである点は AP VM → Git VM と同じため、ここも動的ピンホールでは
# なく恒久ルールとする。internal_lan からの着信は受け付けない (検知は常にこの
# ホスト発のポーリングに限る、§1.1.1)。
pass out on $dev_veth proto tcp from (self) to $git_vm port 3000 keep state

# クライアント端末 → AP VM SSH (§1.2 §1.4)
pass in on $wan_if proto tcp to $ap_vm port 8022 keep state

# ホスト → internal_lan VM: owl-control.sh SSH / DR バックアップ (§2.2)
# vether0 = ホストの internal_lan IP。bridge0/veb0 はスイッチのみで IP を持たない。
pass out on $int_veth proto tcp from (self) to { $ap_vm $db_vm } port 22 keep state

# ホスト → dev_lan VM: owl-control.sh SSH (§4.1)
pass out on $dev_veth proto tcp from (self) to { $git_vm $build_vm } port 22 keep state

# ピンホール: DR 射出時のみ一時的に許可 (§1.1.1 §2.2)。宛先が DNS 解決される
# 外部 IP (B2/rsync.net) のため、デプロイのような内部固定IP宛とは違い時限化が必要。
# owl-control.sh が終了時にテーブルをフラッシュする (trap)
pass out on $wan_if proto tcp from (self) to <pinhole_dst> port 443 keep state label "pinhole"

# ── ホスト管理 SSH ────────────────────────────────────────
# Yubikey セットアップ完了後に yubikey-setup.sh が sshd を停止するまで維持する。
# sshd 停止後はこのルールを削除して pfctl -f /etc/pf.conf を実行する。
# §5: 最終的には物理コンソール管理へ移行し、この行をコメントアウトする。
#
# 強化する場合: 任意 IP ではなく管理者 IP に絞る
#   admin_ip = "x.x.x.x"
#   pass in on $wan_if proto tcp from $admin_ip to (self) port 22 keep state
pass in on $wan_if proto tcp to (self) port 22 keep state
