# newsyslog.conf — ホストログローテーション設定
# §5: 監査ログは DR パイプライン (§2.2) で暗号化アーカイブに同梱される

/var/log/owlv/dr.log            owl-control:wheel  640  90  1024  *  B
/var/log/owlv/basebackup.log    owl-control:wheel  640  30  1024  *  B
/var/log/owlv/integrity.log     root:wheel         640  90   512  *  B
/var/log/owlv/syspatch.log      root:wheel         640  12   512  *  B
/var/log/authlog               root:wheel         640  90  1024  *  B
/var/log/messages              root:wheel         640  90  1024  *  B
/var/log/secure                root:wheel         640  90   512  *  B
