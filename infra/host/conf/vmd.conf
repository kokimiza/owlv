# vmd.conf — OpenBSD Virtual Machine Daemon 設定
# §1.3: vmd による 4 VM のカプセル化。owl-config.toml と値を同期させること。
# Build VM / AP VM は同一 OpenBSD リリースで運用する (§3.1 ロックステップ)。
#
# OpenBSD 7.9: bridge に直接 IP を付与できないため vether を使用する。
#   vether0: ホストの internal_lan IP (10.0.1.1) → bridge0 の member
#   vether1: ホストの dev_lan IP (10.0.2.1)       → bridge1 の member
#   bridge0/bridge1: L2 スイッチのみ (IP なし)
# 起動順: vether → bridge (add vether) → vmd
# 設定ファイル: /etc/hostname.vether{0,1} /etc/hostname.bridge{0,1}

switch "internal_lan" {
    interface bridge0
}

switch "dev_lan" {
    interface bridge1
}

vm "vm-ap" {
    # AP VM (10.0.1.10): Haskell/Brick TUI アプリケーション (§1.4)
    memory 512M
    disk   "/home/vmm/ap.img"
    interface { switch "internal_lan" }
    # enable は provision.sh 完了後に追加して vmctl reload する
}

vm "vm-db" {
    # DB VM (10.0.1.20): PostgreSQL 16 (RLS 有効 / ECC メモリ必須 §1.1)
    memory 1G
    disk   "/home/vmm/db.img"
    interface { switch "internal_lan" }
}

vm "vm-git" {
    # Git VM (10.0.2.10): Forgejo (リポジトリ + パッケージレジストリ)
    memory 1G
    disk   "/home/vmm/git.img"
    interface { switch "dev_lan" }
}

vm "vm-build" {
    # Build VM (10.0.2.20): GHC / cabal / Forgejo Runner (§3.1)
    memory 4G
    disk   "/home/vmm/build.img"
    interface { switch "dev_lan" }
}
