# doas.conf — OpenBSD 権限昇格設定
# §5: 管理経路の極小化。最小権限の原則。

# owl-control: DR 制御スクリプトの実行 (§2.2)
permit nopass owl-control cmd /usr/local/sbin/owl-control.sh

# owl-control: ピンホールテーブル操作 (§1.1.1)
# pfctl に IP アドレスを直接渡さず、検証済みラッパー経由でのみ操作する
permit nopass owl-control cmd /usr/local/sbin/owl-pfctl-pinhole

# owl-control: VM 起動・停止 (§2.4 リストア手順)
permit nopass owl-control cmd /usr/sbin/vmctl

# wheel グループ: 物理コンソール管理者用 (対話的認証)
permit persist :wheel
