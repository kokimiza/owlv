# pf.conf — ホスト OpenBSD パケットフィルタ
# §1.1: エアギャップ設計。デフォルト全遮断。
# §1.1.1: 動的インナーエアギャップ。ピンホール開放/閉鎖は owl-control.sh が制御する。

wan_if   = "em0"
int_sw   = "bridge0"   # internal_lan: 10.0.1.0/24
dev_sw   = "bridge1"   # dev_lan:      10.0.2.0/24

ap_vm    = "10.0.1.10"
db_vm    = "10.0.1.20"
git_vm   = "10.0.2.10"
build_vm = "10.0.2.20"

# デプロイ時: AP VM → Git VM port 443 (§4.2)
# DR 射出時:  ホスト → B2 / rsync.net port 443 (§2.2)
table <pinhole_dst> {}

set block-policy drop
set skip on lo0
block all

# AP VM → DB VM: SCRAM-SHA-256 + TLS (§1.5)
pass on $int_sw proto tcp from $ap_vm to $db_vm port 5432

# Build VM → Git VM: 成果物プッシュ / Runner ジョブ取得 (§4.1)
pass on $dev_sw proto tcp from $build_vm to $git_vm port { 22 443 }

# クライアント端末 → AP VM SSH (§1.2 §1.4)
pass in on $wan_if proto tcp to $ap_vm port 8022

# ピンホール: デプロイ / DR 射出時のみ一時的に許可 (§1.1.1 §2.2)
# owl-control.sh が終了時にテーブルをフラッシュする (trap)
pass out on $wan_if proto tcp from (self) to <pinhole_dst> port 443 label "pinhole"
pass out on $dev_sw proto tcp from $ap_vm to <pinhole_dst> port 443 label "pinhole-deploy"

# ── ホスト管理 SSH ────────────────────────────────────────
# Yubikey セットアップ完了後に yubikey-setup.sh が sshd を停止するまで維持する。
# sshd 停止後はこのルールを削除して pfctl -f /etc/pf.conf を実行する。
# §5: 最終的には物理コンソール管理へ移行し、この行をコメントアウトする。
#
# 強化する場合: 任意 IP ではなく管理者 IP に絞る
#   admin_ip = "x.x.x.x"
#   pass in on $wan_if proto tcp from $admin_ip to (self) port 22
pass in on $wan_if proto tcp to (self) port 22
