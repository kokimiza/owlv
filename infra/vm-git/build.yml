# CI/CD パイプライン (doc/dev_sec_ops.md §3.2 / §4.1 / §4.2)
#
# - PR (opened/synchronize/reopened): Sec(HLint) → Dev(build/test) のみ実行する。
#   結果は Forgejo Web UI 上で管理者の Approve 判断材料になる(§3.3)。
# - main への merge (= 承認済み PR が統合された push): 同じ Sec/Dev を再実行した
#   うえで、タグ付与・リリースビルド・manifest.txt(未署名)添付までを自動実行する。
#   リリースは draft=true で作成する — manifest.txt への signify 署名は
#   Build VM 上では行わない(§4.2: 秘密鍵を Build VM に置かないため)。
#   ホスト側の owl-control.sh sign-poll が未署名(draft=true)のリリースを検知し、
#   manifest.txt.sig を追加添付した上で draft=false に切り替える。これが
#   owl-control.sh deploy-poll(§4.2)が検知する「承認済み・未デプロイ」状態であり、
#   デプロイの起点になる。
#
# vm-build は Docker 非搭載・host モード専用(§3.1)。Node.js を要する公式
# actions/checkout 等は使わず、checkout からリリース作成まで base ツール
# (git/curl/cabal)のみで構成する(§5: base ユーティリティ優先方針)。
#
# 既知の未実装事項: §4.1①の依存関係セキュリティ監査(hsec/OSV, Gated Sync)は
# 同期パイプライン自体が未着手のため、ここでは HLint のみを Sec ゲートとする。

name: build

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  build:
    runs-on: [openbsd, haskell]
    steps:
      - name: checkout
        run: |
          set -eu
          git init -q .
          git -c http.extraHeader="Authorization: token ${FORGEJO_TOKEN}" \
            fetch --depth 50 "${FORGEJO_SERVER_URL}/${FORGEJO_REPOSITORY}.git" "${FORGEJO_SHA}"
          git checkout -q FETCH_HEAD

      # ① Sec: 静的解析 (§4.1①)
      - name: HLint
        run: hlint app src test

      # ② Dev: 再現可能なクリーンビルドと Core ユニットテスト (§3.2, §4.1②)
      - name: cabal build (-Werror, CI 相当)
        run: cabal build --ghc-options="-Werror"

      - name: cabal test (Core のみ。Shell は手動確認対象、§3.2)
        run: cabal test

      # ここから先は main への承認済みマージ時のみ実行する (§4.2)。
      # PR 単体(承認前)では絶対にタグ付与・リリースを行わない。
      - name: リリースタグの算出
        if: ${{ forgejo.event_name == 'push' && forgejo.ref == 'refs/heads/main' }}
        id: ver
        run: |
          set -eu
          CABAL_VER=$(awk -F': *' '/^version:/{print $2; exit}' owlv.cabal)
          SHA_SHORT=$(printf '%s' "${FORGEJO_SHA}" | cut -c1-7)
          echo "tag=v${CABAL_VER}-${SHA_SHORT}" >>"$FORGEJO_OUTPUT"

      - name: 成果物の収集と未署名マニフェスト生成 (§4.2 三重検証の根拠データ)
        if: ${{ steps.ver.outputs.tag != '' }}
        run: |
          set -eu
          # owlv (cabal の executable コンポーネント名) は AP VM 側の配置名
          # owlv-app に合わせてリネームする (infra/host/sbin/owl-control.sh
          # cmd_deploy が期待するダウンロード資産名と一致させる)。
          cp "$(cabal list-bin owlv)" owlv-app-openbsd-amd64
          cp "$(cabal list-bin owlv-batch-center)" owlv-batch-center-openbsd-amd64
          cp "$(cabal list-bin owlv-projector)" owlv-projector-openbsd-amd64

          TAG="${{ steps.ver.outputs.tag }}"
          {
            echo "tag=${TAG}"
            echo "commit=${FORGEJO_SHA}"
            echo "uname_r=$(uname -r)"
            # uname -r はリリース番号のみで syspatch の適用状態(パッチレベル)を
            # 含まない。同一リリースでも syspatch 差があれば ABI 差のリスクが
            # 残るため、稼働中カーネル本体のハッシュも記録し、AP VM 側で完全一致を
            # 要求する (doc/dev_sec_ops.md §1.3, §4.2)。syspatch は通常 /bsd を
            # 置き換える(差分カーネル)ため、これが両VMの syspatch 適用状態が
            # 一致していることの代理指標になる。
            echo "kernel_sha256=$(sha256 -q /bsd)"
            echo "ghc_version=$(ghc --numeric-version)"
            for f in owlv-app-openbsd-amd64 owlv-batch-center-openbsd-amd64 owlv-projector-openbsd-amd64; do
              echo "${f}.sha256=$(sha256 -q "$f")"
            done
          } >manifest.txt

          # signify 署名はここでは行わない。署名鍵は Build VM に置かず、
          # ホスト OS が排他的に保持する (§4.2: 信頼の根の一元化)。
          # ホスト側の owl-control.sh sign-poll が、このあと draft=true で
          # 作成するリリースを検知して manifest.txt.sig を追加添付する。

      - name: "タグを作成して push (§3.3: 不変セマンティックバージョニング)"
        if: ${{ steps.ver.outputs.tag != '' }}
        run: |
          set -eu
          TAG="${{ steps.ver.outputs.tag }}"
          git tag "$TAG" "${FORGEJO_SHA}"
          git -c http.extraHeader="Authorization: token ${FORGEJO_TOKEN}" \
            push "${FORGEJO_SERVER_URL}/${FORGEJO_REPOSITORY}.git" "refs/tags/${TAG}"

      - name: Forgejo リリースを作成し成果物を添付
        if: ${{ steps.ver.outputs.tag != '' }}
        run: |
          set -eu
          TAG="${{ steps.ver.outputs.tag }}"
          UNAME_R="$(uname -r)"
          GHC_VER="$(ghc --numeric-version)"
          BODY="commit: ${FORGEJO_SHA}\\nuname -r: ${UNAME_R}\\nGHC: ${GHC_VER}"

          # draft=true で作成する — manifest.txt はまだ未署名であり、ホスト側の
          # owl-control.sh sign-poll が署名を追加するまでは「承認済み・未デプロイ」
          # 状態(deploy-poll の検知対象)にしない。
          REL_ID=$(curl -fsS -X POST \
            -H "Authorization: token ${FORGEJO_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"${TAG}\",\"name\":\"${TAG}\",\"body\":\"${BODY}\",\"draft\":true,\"prerelease\":false}" \
            "${FORGEJO_API_URL}/repos/${FORGEJO_REPOSITORY}/releases" |
            grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)
          [ -n "$REL_ID" ] || { echo "リリース作成に失敗しました" >&2; exit 1; }

          # manifest.txt.sig はまだ存在しない(ホストが sign-poll で後付けする)。
          for f in \
            owlv-app-openbsd-amd64 owlv-batch-center-openbsd-amd64 owlv-projector-openbsd-amd64 \
            manifest.txt; do
            curl -fsS -X POST \
              -H "Authorization: token ${FORGEJO_TOKEN}" \
              -F "attachment=@${f}" \
              "${FORGEJO_API_URL}/repos/${FORGEJO_REPOSITORY}/releases/${REL_ID}/assets?name=${f}" >/dev/null
          done
