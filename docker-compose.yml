# 開発環境用 Docker Compose。本番環境はOpenBSD VMアーキテクチャ（dev_sec_ops.md §1.3）。
#
# リビルド:
#   docker compose build app
#
# 起動:
#   docker compose up -d db          # DB だけ先に起動
#   docker compose run --rm app      # TUI をアタッチして起動
#
# テスト（Core ユニットテスト）はホスト機で実行:
#   cabal test

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: owl
      POSTGRES_PASSWORD: owl-dev-only # 検証専用。本番値は絶対に書かない
      POSTGRES_DB: owl
    volumes:
      - pgdata:/var/lib/postgresql # PG18+ は pg_ctlcluster 互換のためこの親ディレクトリにマウントする
    # ホストから psql で直接接続したい場合はコメントを外す
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U owl -d owl" ]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy # DB 起動完了を待ってから AP を上げる
    environment:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PGHOST: db
      PGPORT: "5432"
      PGUSER: owl
      PGPASSWORD: owl-dev-only
      PGDATABASE: owl
      OWLV_SSH_USER: owladmin
      OWLV_ROOT_ADMIN_USERNAME: owladmin
    stdin_open: true # TUI 必須
    tty: true # TUI 必須

volumes:
  pgdata:
